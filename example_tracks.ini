# Example tracks.ini file for pyGenomeTracks
# Generated automatically by PYGENOMETRACKS_TOP10 module
# This file configures which tracks to display and their properties

# X-axis configuration
[x-axis]
where = top

# Reference genome annotation - shows genes and their structure
[genes]
file = hg38.gtf
file_type = gtf
title = Genes (hg38)
height = 3
style = flybase
renderGenes = yes
arrowLinkColor = black
arrowLinkStyle = solid
fontsize = 10
showBorder = true
gene_rows = 1
labels = on

# Consensus peak locations - black bars showing where peaks were called
[consensus_peaks]
file = 33K_Ad5/top_peaks.bed
file_type = bed
title = Consensus peaks
height = 1.2
color = black

# Signal track 1: 33K_Ad5_R1 replicate 1 (main treatment)
[signal_1]
file = 33K_Ad5_R1.bw
file_type = bigwig
title = 33K_Ad5_R1
height = 1.5
color = #1f78b4

# Signal track 2: 33K_Ad5_R2 replicate 2 (main treatment)
[signal_2]
file = 33K_Ad5_R2.bw
file_type = bigwig
title = 33K_Ad5_R2
height = 1.5
color = #1f78b4

# Signal track 3: 33K_Ad5_R3 replicate 3 (main treatment)
[signal_3]
file = 33K_Ad5_R3.bw
file_type = bigwig
title = 33K_Ad5_R3
height = 1.5
color = #1f78b4

# Signal track 4: 33K_Mock_R1 replicate 1 (control/other condition - green)
[signal_4]
file = 33K_Mock_R1.bw
file_type = bigwig
title = 33K_Mock_R1 (other rep)
height = 1.5
color = #33a02c

# Signal track 5: 33K_Mock_R2 replicate 2 (control/other condition - green)
[signal_5]
file = 33K_Mock_R2.bw
file_type = bigwig
title = 33K_Mock_R2 (other rep)
height = 1.5
color = #33a02c

# Signal track 6: H3_control_R1 (spike-in control - gray)
[signal_6]
file = H3_control_R1.bw
file_type = bigwig
title = H3_control_R1 (control rep)
height = 1.5
color = #808080
